# ──────────────────────────────────────────────────────────────
# Nightly Build
# ──────────────────────────────────────────────────────────────
# Runs automatically every night (00:00 UTC) and can be triggered
# manually via workflow_dispatch or on pushes to non-main branches.
#
# - Scheduled runs (nightly) → Release build
# - Push to non-main branches → Debug build
#
# Environment variables (set in GitHub repo settings > Actions > Variables):
#   FLUTTER_VERSION  – e.g. "3.44.6"
#   FLUTTER_CHANNEL  – e.g. "stable"
# ──────────────────────────────────────────────────────────────

name: Nightly Build

on:
  schedule:
    - cron: '0 0 * * *'                 # Every day at 00:00 UTC
  workflow_dispatch:                     # Allow manual trigger
  push:
    branches-ignore:
      - main

defaults:
  run:
    working-directory: tiled_warfare

env:
  FLUTTER_VERSION: '3.44.6'
  FLUTTER_CHANNEL: 'stable'
  # Debug on push, Release on schedule/workflow_dispatch
  BUILD_MODE: ${{ github.event_name == 'push' && 'debug' || 'release' }}

concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Tests & Analyse ──────────────────────────────────────────
  test:
    name: Analyze & Test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: tiled_warfare
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: ${{ env.FLUTTER_CHANNEL }}

      - run: flutter pub get

      - run: flutter analyze

      - run: flutter test

  # ── Windows x64 ──────────────────────────────────────────────
  build-windows:
    name: Nightly Windows (x64)
    needs: test
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: tiled_warfare
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: ${{ env.FLUTTER_CHANNEL }}

      - run: flutter pub get

      - run: flutter build windows --${{ env.BUILD_MODE }}

      - name: Upload Nightly Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: tiled_warfare-nightly-${{ github.ref_name }}-${{ github.run_id }}-windows
          path: build/windows/x64/runner/${{ env.BUILD_MODE == 'release' && 'Release' || 'Debug' }}/tiled_warfare.exe
          compression-level: 0

  # ── Linux ────────────────────────────────────────────────────
  build-linux:
    name: Nightly Linux
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: tiled_warfare
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: ${{ env.FLUTTER_CHANNEL }}

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            clang cmake ninja-build pkg-config libgtk-3-dev

      - run: flutter pub get

      - run: flutter build linux --${{ env.BUILD_MODE }}

      - name: Upload Nightly Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: tiled_warfare-nightly-${{ github.ref_name }}-${{ github.run_id }}-linux
          path: build/linux/x64/${{ env.BUILD_MODE == 'release' && 'release' || 'debug' }}/bundle/
          compression-level: 6

  # ── Android APK ──────────────────────────────────────────────
  build-android:
    name: Nightly Android (APK)
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: tiled_warfare
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: ${{ env.FLUTTER_CHANNEL }}

      - run: flutter pub get

      - run: flutter build apk --${{ env.BUILD_MODE }} --android-skip-build-dependency-validation

      - name: Upload Nightly Android APK
        uses: actions/upload-artifact@v4
        with:
          name: tiled_warfare-nightly-${{ github.ref_name }}-${{ github.run_id }}-android
          path: build/app/outputs/flutter-apk/app-${{ env.BUILD_MODE }}.apk
          compression-level: 0