name: Release Build

on:
  push:
    branches:
      - main

defaults:
  run:
    working-directory: tiled_warfare

jobs:
  test:
    name: Analyze & Test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: tiled_warfare
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.6'
          channel: 'stable'
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - run: flutter test

  build-windows:
    name: Build Windows (x64)
    needs: test
    runs-on: windows-latest
    defaults:
      run:
        working-directory: tiled_warfare
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.6'
          channel: 'stable'
      - run: flutter pub get
      - run: flutter build windows --release
      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: tiled_warfare-v0.1.0-windows
          path: build/windows/x64/runner/Release/tiled_warfare.exe
          compression-level: 0

  build-linux:
    name: Build Linux (AppImage)
    needs: [build-windows, test]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tiled_warfare
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.6'
          channel: 'stable'
      - run: |
          sudo apt-get update -y
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev
      - run: flutter pub get
      - run: flutter build linux --release
      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: tiled_warfare-v0.1.0-linux
          path: build/linux/x64/release/bundle/
          compression-level: 6

  build-android:
    name: Build Android (APK)
    needs: [build-windows, test]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tiled_warfare
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.6'
          channel: 'stable'
      - run: flutter pub get
      - run: flutter build apk --release --android-skip-build-dependency-validation
      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: tiled_warfare-v0.1.0-android
          path: build/app/outputs/flutter-apk/app-release.apk
          compression-level: 0

  create-release:
    name: Create GitHub Release
    needs: [build-windows, build-linux, build-android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: tiled_warfare
    steps:
      - uses: actions/checkout@v4
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Create release archive
        run: |
          mkdir -p release
          cp ../artifacts/tiled_warfare-v0.1.0-windows/tiled_warfare.exe release/
          zip -r release/tiled_warfare-v0.1.0-linux.zip ../artifacts/tiled_warfare-v0.1.0-linux/
          cp ../artifacts/tiled_warfare-v0.1.0-android/app-release.apk release/tiled_warfare-v0.1.0-android.apk
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.0
          name: "Prototyp v0.1.0"
          body: |
            ## 🎮 Tiled Warfare – Erster Prototyp

            **Version:** 0.1.0

            ### 📥 Downloads

            | Plattform | Datei |
            |-----------|-------|
            | Windows   | `tiled_warfare.exe` |
            | Linux     | `tiled_warfare-v0.1.0-linux.zip` |
            | Android   | `tiled_warfare-v0.1.0-android.apk` |
          files: |
            tiled_warfare/release/tiled_warfare.exe
            tiled_warfare/release/tiled_warfare-v0.1.0-linux.zip
            tiled_warfare/release/tiled_warfare-v0.1.0-android.apk
          draft: true
          prerelease: true